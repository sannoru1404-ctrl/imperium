<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Imperium: Тотальная война</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=PT+Serif:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1c1712;--panel:#2a221a;--line:#5a4630;--gold:#e0b34a;--text:#efe4cc;--muted:#a8977a;--red:#c0392b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'PT Serif',Georgia,serif;overflow:hidden}
button{font-family:inherit;font-size:15px;border:1px solid var(--line);background:#3a2e21;color:var(--text);padding:9px 12px;border-radius:8px;cursor:pointer}
button:active{transform:scale(.97)}
button.pri{background:linear-gradient(#a8322a,#7a1f19);border-color:#d4574c;font-weight:700}
button:disabled{opacity:.4}
.h{font-family:'Cinzel',serif;letter-spacing:.5px}
#app{display:flex;flex-direction:column;height:100%}
#top{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#140f0b;border-bottom:1px solid var(--line)}
#top .stat{font-size:14px;white-space:nowrap}
#top .grow{flex:1}
#mapWrap{flex:1;min-height:0;position:relative;background:#22465e}
#map{width:100%;height:100%;display:block}
#panel{max-height:46%;overflow-y:auto;background:var(--panel);border-top:2px solid var(--line);padding:10px 12px 14px}
#log{font-size:13px;color:var(--muted);min-height:18px;margin-bottom:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;padding:5px 8px;border-radius:7px;background:#3a2e21;border:1px solid var(--line);font-size:13px;margin:3px 3px 0 0}
.chip.sel{border-color:var(--gold);background:#4d3b22;box-shadow:0 0 0 1px var(--gold) inset}
.hpb{display:inline-block;width:28px;height:5px;background:#000;border-radius:3px;overflow:hidden;vertical-align:middle}
.hpb i{display:block;height:100%;background:#7bc96f}
.overlay{position:fixed;inset:0;background:rgba(10,7,5,.82);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:18px;max-width:420px;width:100%;max-height:90%;overflow-y:auto;box-shadow:0 10px 40px #000}
.modal h2{margin:0 0 10px;font-family:'Cinzel',serif;color:var(--gold);font-size:20px}
.modal p{margin:6px 0;line-height:1.4}
.rec{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #3d3124}
.small{font-size:12px;color:var(--muted)}
/* battle 3d */
#battle{position:fixed;inset:0;background:#000;z-index:40;display:none}
#b3d{position:absolute;inset:0}
#b3d canvas{display:block;width:100%;height:100%}
.bh{position:absolute;left:0;right:0;pointer-events:none;padding:8px 10px}
.bh button,.bh .card{pointer-events:auto}
#bHead{top:0;background:linear-gradient(rgba(10,7,5,.85),rgba(10,7,5,0))}
#bFoot{bottom:0;background:linear-gradient(rgba(10,7,5,0),rgba(10,7,5,.9) 30%);padding-top:22px}
.bars{display:flex;gap:8px;align-items:center;font-size:12px;margin-top:5px}
.bar{flex:1;height:8px;background:#000a;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;transition:width .3s}
#bMsg{position:absolute;top:74px;left:0;right:0;text-align:center;font-size:14px;font-weight:700;text-shadow:0 1px 3px #000,0 0 6px #000;pointer-events:none;line-height:1.5}
#bCards{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.card{flex:0 0 auto;width:52px;background:#2a221acc;border:2px solid #5a4630;border-radius:8px;padding:4px;text-align:center;cursor:pointer}
.card.sel{border-color:var(--gold);background:#4d3b22dd;box-shadow:0 0 8px #e0b34a88}
.card.gone{opacity:.35}
.card .ci{font-size:22px;line-height:1.2}
.cb{height:4px;background:#000;border-radius:2px;overflow:hidden;margin-top:3px}
.cb i{display:block;height:100%}
.cb .m{background:#7bc96f}.cb .mo{background:#e8c35a}
#bInfo{font-size:13px;margin:2px 0 6px;min-height:18px;text-shadow:0 1px 2px #000}
.bbtn{padding:8px 10px;font-size:14px}
#title{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 35%,#4a2a18,#120c08 70%);text-align:center;padding:20px}
#title h1{font-family:'Cinzel',serif;font-weight:800;font-size:44px;margin:0;color:var(--gold);text-shadow:0 3px 0 #5a2a10,0 0 30px #a0602080}
#title .sub{color:var(--muted);font-size:15px;max-width:320px}
#title button{min-width:220px;font-size:17px;padding:12px}
</style>
</head>
<body>
<div id="title">
  <div style="font-size:54px">🦅</div>
  <h1>IMPERIUM</h1>
  <div class="sub">Поведи Рим к господству над Средиземноморьем. Захвати 14 провинций из 18 — и не потеряй сам Рим.</div>
  <button class="pri" onclick="newGame()">Новая игра</button>
  <button id="contBtn" onclick="loadGame()" style="display:none">Продолжить</button>
  <button onclick="showHelp()">Как играть</button>
</div>

<div id="app">
  <div id="top">
    <span class="h" style="color:var(--gold)">🦅 SPQR</span>
    <span class="stat" id="sGold"></span>
    <span class="stat" id="sTurn"></span>
    <span class="grow"></span>
    <button onclick="showHelp()" style="padding:7px 10px">?</button>
    <button class="pri" id="endBtn" onclick="endTurn()">Ход ▶</button>
  </div>
  <div id="mapWrap"><svg id="map" viewBox="0 0 400 440" preserveAspectRatio="xMidYMid meet"></svg></div>
  <div id="panel"><div id="log"></div><div id="pInfo"></div></div>
</div>

<div id="battle">
  <div id="b3d"></div>
  <div class="bh" id="bHead">
    <div class="row" style="justify-content:space-between;flex-wrap:nowrap">
      <span class="h" id="bTitle" style="color:var(--gold);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></span>
      <div class="row" style="flex-wrap:nowrap;gap:6px"><span id="bTime" class="small"></span><button class="bbtn" id="bSpeed" onclick="bSpeed()">×1</button><button class="bbtn pri" id="bPause" onclick="bPause()">▶</button></div>
    </div>
    <div class="bars"><span>🟥</span><div class="bar"><i id="barP" style="background:#d9534f"></i></div><div class="bar"><i id="barE" style="background:#5b7bd9"></i></div><span>🟦</span></div>
  </div>
  <div id="bMsg"></div>
  <div class="bh" id="bFoot">
    <div id="bInfo"></div>
    <div id="bCards"></div>
    <div class="row" style="gap:6px">
      <button class="bbtn" onclick="bSelAll()">Все</button>
      <button class="bbtn pri" onclick="bCharge()">⚔ В атаку!</button>
      <button class="bbtn" onclick="bHalt()">✋ Стоп</button>
      <button class="bbtn" onclick="bAuto()">🎲</button>
      <button class="bbtn" onclick="bRetreat()">🏳</button>
    </div>
  </div>
</div>

<div id="modalRoot"></div>

<script>
// ===================== DATA =====================
const FACT={
 rome:{n:'Рим',c:'#c0392b',cap:'roma'},
 carth:{n:'Карфаген',c:'#8e44ad',cap:'carthago'},
 gaul:{n:'Галлы',c:'#2e8b3e',cap:'gallia'},
 greek:{n:'Греки',c:'#2a6fc9',cap:'maced'},
 rebel:{n:'Мятежники',c:'#7d7468'}
};
const UT={
 mil:{n:'Ополчение',i:'🔱',atk:4,def:3,mov:2,rng:1,cost:150},
 sword:{n:'Мечники',rn:'Легионеры',i:'⚔️',atk:7,def:5,mov:2,rng:1,cost:300},
 spear:{n:'Копейщики',rn:'Триарии',i:'🛡️',atk:5,def:7,mov:2,rng:1,cost:350},
 arch:{n:'Лучники',rn:'Сагиттарии',i:'🏹',atk:5,def:2,mov:2,rng:4,cost:300},
 cav:{n:'Конница',rn:'Эквиты',i:'🐎',atk:7,def:4,mov:4,rng:1,cost:500},
 eleph:{n:'Боевые слоны',i:'🐘',atk:10,def:6,mov:3,rng:1,cost:800}
};
const RECRUIT={rome:['sword','spear','arch','cav'],carth:['sword','spear','arch','cav','eleph'],gaul:['sword','spear','arch','cav'],greek:['sword','spear','arch','cav'],rebel:['mil']};
function uname(t,f){return (f==='rome'&&UT[t].rn)||UT[t].n}

const PROV_DEF=[
 ['iberia','Иберия',55,190,'rebel',150],
 ['ncarth','Новый Карфаген',88,240,'carth',180],
 ['narbo','Нарбон',135,140,'gaul',170],
 ['gallia','Галлия',105,70,'gaul',200],
 ['germ','Германия',230,40,'gaul',130],
 ['cisalp','Цизальпина',195,108,'gaul',180],
 ['illyr','Иллирия',282,98,'rebel',140],
 ['roma','Рим',236,168,'rome',260],
 ['capua','Капуя',258,205,'rome',200],
 ['taras','Тарент',290,240,'rebel',190],
 ['syrac','Сиракузы',262,296,'rebel',210],
 ['sard','Сардиния',191,243,'carth',120],
 ['carthago','Карфаген',205,348,'carth',280],
 ['numid','Нумидия',90,362,'carth',140],
 ['cyren','Киренаика',340,400,'rebel',170],
 ['maced','Македония',335,148,'greek',220],
 ['epir','Эпир',315,192,'greek',150],
 ['athen','Афины',350,230,'greek',250]
];
const ADJ=[['iberia','ncarth'],['iberia','narbo'],['ncarth','numid',1],['narbo','gallia'],['narbo','cisalp'],['narbo','sard',1],
['gallia','germ'],['gallia','cisalp'],['germ','cisalp'],['germ','illyr'],['cisalp','roma'],['cisalp','illyr'],
['roma','capua'],['roma','sard',1],['capua','taras'],['capua','syrac',1],['taras','syrac',1],['taras','epir',1],
['syrac','carthago',1],['sard','carthago',1],['carthago','numid'],['carthago','cyren'],['cyren','athen',1],
['illyr','maced'],['illyr','epir'],['maced','epir'],['maced','athen'],['epir','athen']];
const START_ARMY={
 roma:['sword','sword','spear','arch','cav'],capua:['sword','arch'],
 carthago:['sword','sword','eleph','cav','arch'],numid:['cav','cav'],ncarth:['sword','spear'],
 gallia:['sword','sword','sword','cav'],cisalp:['sword','sword','arch'],narbo:['spear'],
 maced:['spear','spear','cav','arch'],athen:['spear','arch']
};
const WIN_N=14;

let G=null; // game state
let uid=1;
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function mk(t,hp=100){return {id:uid++,t,hp}}
function P(id){return G.prov.find(p=>p.id===id)}
function adj(id){return ADJ.filter(a=>a[0]===id||a[1]===id).map(a=>a[0]===id?a[1]:a[0])}
function isSea(a,b){return ADJ.some(x=>((x[0]===a&&x[1]===b)||(x[0]===b&&x[1]===a))&&x[2])}

function newGame(){
 uid=1;
 G={turn:1,sel:null,pick:new Set(),log:[],
  fac:{rome:{gold:1200},carth:{gold:1000},gaul:{gold:900},greek:{gold:1000},rebel:{gold:0}},
  prov:PROV_DEF.map(d=>({id:d[0],n:d[1],x:d[2],y:d[3],owner:d[4],base:d[5],lvl:d[0]===FACT[d[4]]?.cap?2:1,gar:2,army:[],moved:false,rec:0}))};
 G.prov.forEach(p=>{if(FACT[p.owner].cap===p.id)p.lvl=2;p.gar=p.owner==='rebel'?3:FACT[p.owner].cap===p.id?4:2;(START_ARMY[p.id]||[]).forEach(t=>p.army.push(mk(t)))});
 $('title').style.display='none';
 addLog('Сенат вручил тебе легионы. Да начнётся завоевание!');
 render();
}
function save(){try{localStorage.setItem('imperium_save',JSON.stringify({G:{...G,pick:[]},uid}))}catch(e){}}
function loadGame(){try{const s=JSON.parse(localStorage.getItem('imperium_save'));G=s.G;G.pick=new Set();uid=s.uid;$('title').style.display='none';render()}catch(e){newGame()}}
try{const s=localStorage.getItem('imperium_save');if(s&&!JSON.parse(s).G.over)$('contBtn').style.display=''}catch(e){}

function addLog(t){G.log.unshift(t);G.log=G.log.slice(0,4);}
function income(f){
 let inc=0,up=0;
 G.prov.forEach(p=>{if(p.owner===f){inc+=Math.round(p.base*(1+0.5*(p.lvl-1)));up+=p.army.length*20}});
 return {inc,up,net:inc-up};
}
function str(units,bonus=1){return units.reduce((s,u)=>{const d=UT[u.t];return s+(d.atk+d.def+(d.rng>1?2:0)+(d.mov>2?2:0))*u.hp/100},0)*bonus}
function garUnits(p){const a=[];for(let i=0;i<p.gar;i++){const u=mk('mil');u.gar=true;a.push(u)}return a}

// ===================== MAP RENDER =====================
function render(){
 const f=G.fac.rome, inc=income('rome');
 $('sGold').innerHTML=`💰 ${f.gold} <span class="small" style="color:${inc.net>=0?'#7bc96f':'#e57373'}">${inc.net>=0?'+':''}${inc.net}</span>`;
 $('sTurn').innerHTML=`📜 Ход ${G.turn} · 🏛 ${G.prov.filter(p=>p.owner==='rome').length}/${WIN_N}`;
 $('log').innerHTML=G.log.slice(0,2).map((l,i)=>`<div style="opacity:${1-i*0.4}">${l}</div>`).join('');
 drawMap();drawPanel();
}
function drawMap(){
 const sel=G.sel?P(G.sel):null;
 const canMove=sel&&sel.owner==='rome'&&sel.army.length&&!sel.moved&&pickedUnits(sel).length;
 const targets=canMove?adj(sel.id):[];
 let s=`<defs><pattern id="wv" width="20" height="10" patternUnits="userSpaceOnUse"><path d="M0 5 Q5 2 10 5 T20 5" stroke="#2c5875" fill="none" stroke-width="1"/></pattern>
 <filter id="sh"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-opacity=".6"/></filter></defs>
 <rect width="400" height="440" fill="#22465e"/><rect width="400" height="440" fill="url(#wv)"/>
 <g fill="#b9a374" stroke="#7a6640" stroke-width="1.5" filter="url(#sh)">
 <path d="M0,0 L400,0 L400,150 L375,160 L360,200 L372,252 L345,252 L330,215 L300,200 L285,160 L262,140 L250,150 L270,180 L300,230 L322,250 L305,268 L285,247 L270,252 L250,215 L225,175 L205,140 L180,160 L150,176 L120,176 L112,205 L102,255 L60,265 L28,242 L18,180 L38,130 L80,120 L88,100 L60,92 L20,62 L0,62 Z"/>
 <path d="M0,328 L60,318 L120,330 L180,318 L222,318 L238,335 L262,350 L300,370 L340,374 L400,368 L400,440 L0,440 Z"/>
 <path d="M238,288 L288,282 L272,312 Z"/><path d="M182,214 L199,214 L201,272 L184,274 Z"/></g>`;
 ADJ.forEach(([a,b,sea])=>{const A=P(a),B=P(b);s+=`<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="${sea?'#9cc3dd':'#5d4a2c'}" stroke-width="1.6" stroke-dasharray="${sea?'4 4':'2 3'}" opacity=".8"/>`});
 if(canMove)targets.forEach(t=>{const T=P(t);s+=`<line x1="${sel.x}" y1="${sel.y}" x2="${T.x}" y2="${T.y}" stroke="#ffd84a" stroke-width="3" opacity=".8"/>`});
 G.prov.forEach(p=>{
  const c=FACT[p.owner].c, isSel=G.sel===p.id, isT=targets.includes(p.id);
  const cap=FACT[p.owner].cap===p.id;
  if(isT)s+=`<circle cx="${p.x}" cy="${p.y}" r="20" fill="none" stroke="${p.owner==='rome'?'#ffd84a':'#ff5544'}" stroke-width="3" class="pulse"/>`;
  s+=`<g onclick="tapProv('${p.id}')" style="cursor:pointer">
  <circle cx="${p.x}" cy="${p.y}" r="22" fill="transparent"/>
  <circle cx="${p.x}" cy="${p.y}" r="${isSel?15:13}" fill="${c}" stroke="${isSel?'#ffd84a':'#1a120a'}" stroke-width="${isSel?3:2}"/>
  <text x="${p.x}" y="${p.y+4.5}" text-anchor="middle" font-size="12">${cap?'👑':['🏠','🏘','🏰'][p.lvl-1]}</text>
  <text x="${p.x}" y="${p.y+26}" text-anchor="middle" font-size="9.5" font-family="PT Serif" font-weight="700" fill="#fff" stroke="#1a120a" stroke-width="2.5" paint-order="stroke">${p.n}</text>`;
  if(p.army.length)s+=`<g transform="translate(${p.x+10},${p.y-20})"><rect x="0" y="0" width="22" height="13" rx="3" fill="#1a120a" stroke="${c}" stroke-width="1.5"/><text x="11" y="10" text-anchor="middle" font-size="9" fill="${p.moved&&p.owner==='rome'?'#888':'#fff'}" font-weight="700">⚔${p.army.length}</text></g>`;
  s+=`</g>`;
 });
 $('map').innerHTML=s;
}
function pickedUnits(p){return p.army.filter(u=>G.pick.has(u.id))}
function drawPanel(){
 const p=G.sel?P(G.sel):null;
 if(!p){$('pInfo').innerHTML=`<div class="small">Нажми на провинцию. Своей армией — нажми на соседнюю провинцию, чтобы идти туда или атаковать.</div>`;return}
 const own=p.owner==='rome', fc=FACT[p.owner];
 let h=`<div class="row" style="justify-content:space-between"><div><span class="h" style="font-size:17px;color:${fc.c==='#7d7468'?'#ccc':fc.c};filter:brightness(1.5)">${p.n}</span> <span class="small">· ${fc.n} · ур. ${p.lvl}</span></div>
 <div class="small">💰${Math.round(p.base*(1+0.5*(p.lvl-1)))} · 🔱${p.gar}</div></div>`;
 if(p.army.length){
  h+=`<div style="margin-top:6px">`;
  if(own)h+=`<div class="small">${p.moved?'Армия уже ходила.':'Нажимай на отряды, чтобы выбрать, кто пойдёт:'}</div>`;
  p.army.forEach(u=>{h+=`<span class="chip ${own&&G.pick.has(u.id)?'sel':''}" ${own?`onclick="togglePick(${u.id})"`:''}>${UT[u.t].i} ${uname(u.t,p.owner)} <span class="hpb"><i style="width:${u.hp}%"></i></span></span>`});
  h+=`</div><div class="small" style="margin-top:4px">Сила армии: ${Math.round(str(p.army))}</div>`;
 } else h+=`<div class="small" style="margin-top:6px">Армии нет. Гарнизон: ${p.gar} ополч.</div>`;
 if(own){
  const upc=400*p.lvl;
  h+=`<div class="row" style="margin-top:10px"><button onclick="openRecruit()" ${p.army.length>=8||p.rec>=p.lvl?'disabled':''}>⚒ Нанять (${p.lvl-p.rec})</button>
  ${p.lvl<3?`<button onclick="upgrade()" ${G.fac.rome.gold<upc?'disabled':''}>🏛 Улучшить · ${upc}</button>`:''}</div>`;
 } else {
  const neigh=adj(p.id).some(a=>P(a).owner==='rome'&&P(a).army.length);
  h+=`<div class="small" style="margin-top:6px">Оборона: ${Math.round(str(p.army)+str(garUnits(p),1.2))}${neigh?' — выбери свою соседнюю армию и атакуй.':''}</div>`;
 }
 $('pInfo').innerHTML=h;
}
function togglePick(id){G.pick.has(id)?G.pick.delete(id):G.pick.add(id);render()}

function tapProv(id){
 if(G.busy)return;
 const sel=G.sel?P(G.sel):null, t=P(id);
 if(sel&&sel.owner==='rome'&&!sel.moved&&adj(sel.id).includes(id)&&pickedUnits(sel).length){moveArmy(sel,t);return}
 G.sel=id;G.pick=new Set(t.owner==='rome'?t.army.map(u=>u.id):[]);render();
}

async function moveArmy(from,to){
 const units=pickedUnits(from);
 if(to.owner==='rome'){
  if(to.army.length+units.length>8){toast('В армии не больше 8 отрядов.');return}
  from.army=from.army.filter(u=>!G.pick.has(u.id));
  to.army.push(...units);to.moved=true;
  G.sel=to.id;G.pick=new Set();addLog(`Армия перешла в ${to.n}.`);render();return;
 }
 const def=[...to.army,...garUnits(to)];
 if(!def.length){from.army=from.army.filter(u=>!G.pick.has(u.id));capture(to,'rome',units);G.sel=to.id;G.pick=new Set();render();checkEnd();return}
 const sa=Math.round(str(units)),sd=Math.round(str(to.army)+str(garUnits(to),1.2));
 const ch=await ask(`Битва за ${to.n}`,`<p>Твои силы: <b>${sa}</b> (${units.length} отр.)</p><p>Враг (${FACT[to.owner].n}): <b>${sd}</b> (${to.army.length} отр. + ${to.gar} ополч.)</p>${isSea(from.id,to.id)?'<p class="small">⛵ Морской десант</p>':''}`,
  [['fight','⚔ Командовать',1],['auto','🎲 Авторасчёт'],['no','Отмена']]);
 if(ch==='no')return;
 from.army=from.army.filter(u=>!G.pick.has(u.id));
 G.pick=new Set();
 const res=ch==='fight'?await tactical(units,def,'rome',to.owner,'att',to.n):autoResolve(units,def,1);

function capture(p,f,units){
 const old=p.owner;p.owner=f;p.army=units;p.gar=1;p.moved=true;
 addLog(`${FACT[f].n}: захвачена провинция ${p.n}!`);
 if(f==='rome'&&FACT[old].cap===p.id)addLog(`Пала столица — ${FACT[old].n} потрясены!`);

function applyBattle(from,to,af,res){
 // res: {win:'att'|'def', att:[], def:[]} survivors
 const defF=to.owner;
 if(res.win==='att'){
  capture(to,af,res.att);

 } else {
  to.army=res.def.filter(u=>!u.gar);

  from.army.push(...back.slice(0,Math.max(0,8-from.army.length)));
  from.moved=true;
  addLog(`${FACT[defF].n} отстояли ${to.n}. ${FACT[af].n} отступили.`);

 if(res.win==='att')addLog(`Победа ${af==='rome'?'Рима':FACT[af].n} при ${to.n}.`);
}

async function aiTurn(f){
 const F=G.fac[f];
 const mine=()=>G.prov.filter(p=>p.owner===f);
 const border=p=>adj(p.id).some(a=>P(a).owner!==f);
 // upgrade
 if(F.gold>1400){const p=mine().filter(p=>p.lvl<3).sort((a,b)=>b.base-a.base)[0];if(p){F.gold-=400*p.lvl;p.lvl++}}
 // recruit
 const pool=RECRUIT[f], w={sword:3,spear:2,arch:2,cav:2,eleph:1};
 const bag=[];pool.forEach(t=>{for(let i=0;i<(w[t]||1);i++)bag.push(t)});
 const rp=mine().sort((a,b)=>(border(b)-border(a))||(b.lvl-a.lvl));
 for(const p of rp){
  while(p.army.length<8&&p.rec<p.lvl){
   const t=bag[Math.floor(Math.random()*bag.length)];
   const reserve=G.turn<4?0:150;
   if(F.gold<UT[t].cost+reserve||income(f).net<40)break;
   F.gold-=UT[t].cost;p.army.push(mk(t));p.rec++;
  }
 }
 // moves
 const aggr=f==='gaul'?1.15:1.3;
 for(const p of mine()){
  if(!p.army.length||p.moved||p.owner!==f)continue;
  const s=str(p.army);
  let best=null,bs=0;
  adj(p.id).forEach(a=>{const t=P(a);if(t.owner===f)return;
   const ds=str(t.army)+str(garUnits(t),1.2)+0.1;let r=s/ds;
   if(t.owner==='rome'){if(G.turn<4)return;r*=1.1}
   if(r>bs){bs=r;best=t}});
  if(best&&bs>aggr){
   // leave one unit at home if the home is threatened by Rome
   let units=p.army;
   const threat=adj(p.id).some(a=>P(a).owner==='rome'&&P(a).army.length);
   if(threat&&p.army.length>=4){units=p.army.slice(0,-1);p.army=p.army.slice(-1)} else p.army=[];
   await aiAttack(p,best,f,units);
   if(G.over)return;
  } else if(!border(p)){
   // move toward frontier
   const step=pathToBorder(p,f);
   if(step&&step.army.length+p.army.length<=8){step.army.push(...p.army);p.army=[];step.moved=true}
  }
 }
}
function pathToBorder(start,f){
 const q=[[start.id,null]],seen=new Set([start.id]);
 while(q.length){const [id,first]=q.shift();const p=P(id);
  if(id!==start.id&&adj(id).some(a=>P(a).owner!==f))return P(first);
  for(const a of adj(id)){if(!seen.has(a)&&P(a).owner===f){seen.add(a);q.push([a,first||a])}}}
 return null;
}
async function aiAttack(from,to,f,units){
 const def=[...to.army,...garUnits(to)];
 if(to.owner==='rome'){
  G.sel=to.id;render();
  if(!def.length){capture(to,f,units);render();await sleep(500);checkEnd();return}
  const ch=await ask(`⚠ ${FACT[f].n} атакуют!`,`<p>Враг вторгся в провинцию <b>${to.n}</b>.</p><p>Враг: <b>${Math.round(str(units))}</b> (${units.length} отр.)</p><p>Твоя оборона: <b>${Math.round(str(to.army)+str(garUnits(to),1.2))}</b> (${to.army.length} отр. + ${to.gar} ополч.)</p>`,
   [['fight','⚔ Командовать',1],['auto','🎲 Авторасчёт']]);
  const res=ch==='fight'?await tactical(units,def,f,'rome','def',to.n):autoResolve(units,def,1.2);
  applyBattle(from,to,f,res);G.sel=null;render();checkEnd();
 } else {
  if(!def.length){capture(to,f,units);return}
  const res=autoResolve(units,def,1.2);applyBattle(from,to,f,res);
 }
}
function autoResolve(att,def,garBonus){
 const sa=str(att)*rnd(.85,1.15), sd=(str(def.filter(u=>!u.gar))+str(def.filter(u=>u.gar),garBonus))*rnd(.85,1.15);
 const win=sa>=sd?'att':'def';
 const W=win==='att'?att:def, L=win==='att'?def:att;
 const ratio=Math.min(sa,sd)/Math.max(sa,sd);
 W.forEach(u=>u.hp=Math.round(u.hp*(1-Math.min(.85,ratio*rnd(.35,.7)))));
 L.forEach(u=>u.hp=Math.round(u.hp*rnd(0,.35)));
 const alive=a=>a.filter(u=>u.hp>=15);
 return {win,att:alive(att),def:win==='def'?alive(def):[]};
}

// ===================== TACTICAL BATTLE 3D =====================
let B=null;
const SPD={2:5,3:6.5,4:10};
const CONTACT=6.5, RANGE=48, FIELD=80;
const FIGMAX={inf:25,cav:12,eleph:4};
function bodyOf(t){return t==='cav'?'cav':t==='eleph'?'eleph':'inf'}
function alive(r){return !r.fled&&!r.dead}
function rdist(a,b){return Math.hypot(a.x-b.x,a.z-b.z)}
function fwd(r){return [Math.sin(r.face),Math.cos(r.face)]}
function angWrap(d){while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d}
function Hgt(x,z){
 const s=B?B.seed:0;
 let h=1.1*Math.sin(x*0.045+s)+0.9*Math.cos(z*0.05+s*2)+0.5*Math.sin((x+z)*0.08+s*3);
 const ox=Math.max(0,Math.abs(x)-105),oz=Math.max(0,Math.abs(z)-125);
 return h+ox*0.35+oz*0.35;
}

function makeReg(o,side,x,z){

 const r={id:uid++,o,t:o.t,side,men:o.hp,start:Math.max(o.hp,1),morale:100,x,z,face:side==='p'?Math.PI:0,
  order:null,state:'idle',chargeT:0,cool:Math.random()*2,fled:false,dead:false,routing:false,inForest:false,
  spd:SPD[d.mov]||5,ranged:d.rng>1,cav:o.t==='cav'||o.t==='eleph',body,figs:[],bannerKey:''};
 const n=Math.max(1,Math.ceil(r.men/100*FIGMAX[body]));
 for(let i=0;i<n;i++)r.figs.push({x,z,ph:Math.random()*6.28,j:(Math.random()-.5)*0.3});
 return r;
}
function formation(r){
 const b=r.body;
 return b==='inf'?{cols:8,sx:1.3,sz:1.6}:b==='cav'?{cols:6,sx:2.1,sz:3.0}:{cols:4,sx:4.2,sz:5.5};
}
function setupBattle(att,def,af,df,playerSide,place){
 const pu=playerSide==='att'?att:def, eu=playerSide==='att'?def:att;
 B={regs:[],att,def,playerSide,af,df,ef:playerSide==='att'?df:af,place,time:0,pending:[],seed:Math.random()*10,
  paused:true,speed:1,sel:new Set(),over:false,aiT:0,msgs:[],forests:[]};
 for(let i=0;i<3;i++)B.forests.push({x:(Math.random()-.5)*130,z:(Math.random()-.5)*40,r:9+Math.random()*7});
 const deploy=(units,side)=>{
  const zs=side==='p'?1:-1;
  const mel=units.filter(u=>UT[u.t].rng===1&&u.t!=='cav'),cav=units.filter(u=>u.t==='cav'),rng=units.filter(u=>UT[u.t].rng>1);
  const line=(arr,z)=>arr.forEach((u,i)=>B.regs.push(makeReg(u,side,(i-(arr.length-1)/2)*15,z*zs)));
  line(mel,38);line(rng,mel.length?54:40);
  const half=Math.max(mel.length,rng.length,1)*15/2;
  cav.forEach((u,i)=>B.regs.push(makeReg(u,side,(i%2?1:-1)*(half+12+Math.floor(i/2)*14),44*zs)));
 };
 deploy(pu,'p');deploy(eu,'e');
 B.init={p:0,e:0};B.cur={p:0,e:0};
 B.regs.forEach(r=>{B.init[r.side]+=r.men});
}

// ---------- simulation ----------
function turnTo(r,tx,tz,dt,rate=3){const d=angWrap(Math.atan2(tx-r.x,tz-r.z)-r.face);const m=rate*dt;r.face+=Math.max(-m,Math.min(m,d))}
function moveTo(r,tx,tz,dt,mult=1){
 const dx=tx-r.x,dz=tz-r.z,d=Math.hypot(dx,dz);if(d<0.4)return true;
 const sp=r.spd*mult*(r.inForest?(r.cav?0.6:0.85):1);const s=Math.min(d,sp*dt);
 r.x+=dx/d*s;r.z+=dz/d*s;turnTo(r,tx,tz,dt,6);return d<=s+0.4;
}
function meleeHit(a,b,dt,burst){
 const da=UT[a.t],db=UT[b.t];
 const atk=a.ranged?da.atk*0.5:da.atk;let mult=1;
 if(a.t==='spear'&&b.cav)mult*=2;
 if(a.t==='cav'&&b.t==='arch')mult*=1.5;
 if(a.t==='eleph'&&b.t!=='spear')mult*=1.3;
 if(b.routing)mult*=2;
 const [fx,fz]=fwd(b);const vx=a.x-b.x,vz=a.z-b.z,vl=Math.hypot(vx,vz)||1;const dot=(fx*vx+fz*vz)/vl;
 let fl=1;if(!b.routing){if(dot<-0.35)fl=1.8;else if(dot<0.35)fl=1.35}
 const def=db.def*(b.inForest?1.25:1);
 const eff=atk*mult*fl/def*(0.35+0.65*a.men/a.start);
 let dmg;
 if(burst){dmg=9*eff;if(b.t==='spear'&&dot>0.35){dmg*=0.3;a.men-=6;a.morale-=10}b.morale-=15;fx3d('charge',a,b);msg((a.side==='p'?'Твоя ':'Вражеская ')+uname(a.t,a.side==='p'?'rome':B.ef).toLowerCase()+' врезается в строй!')}
 else dmg=1.0*dt*eff;
 b.men-=dmg;b.morale-=dmg*1.1+(fl>1&&!burst?(fl>1.5?5:2.5)*dt:0);
 if(fl>1.5&&!b.flankMsg&&b.side==='p'){b.flankMsg=true;msg('⚠ Удар в тыл: '+uname(b.t,'rome'))}
}
function fire(a,b){
 a.cool=3.2+Math.random()*0.6;
 let dmg=5.5*UT[a.t].atk/UT[b.t].def*(0.35+0.65*a.men/a.start);
 if(b.inForest)dmg*=0.5;
 const [fx,fz]=fwd(b);const vx=a.x-b.x,vz=a.z-b.z,vl=Math.hypot(vx,vz)||1;
 if((fx*vx+fz*vz)/vl>0.35&&b.body==='inf'&&b.t!=='arch')dmg*=0.7; // shields
 const dur=0.9+rdist(a,b)/60;
 B.pending.push({t:dur,b,dmg});
 fx3d('volley',a,b,dur);
}
function simStep(dt){
 B.time+=dt;
 B.pending=B.pending.filter(p=>{p.t-=dt;if(p.t<=0){if(alive(p.b)){p.b.men-=p.dmg;p.b.morale-=p.dmg*0.8}return false}return true});
 for(const s of ['p','e'])B.cur[s]=B.regs.filter(r=>r.side===s&&alive(r)&&!r.routing).reduce((a,r)=>a+r.men,0);
 for(const r of B.regs)if(alive(r))r.inForest=B.forests.some(f=>Math.hypot(r.x-f.x,r.z-f.z)<f.r);
 for(const r of B.regs){
  if(!alive(r))continue;
  const prevFight=r.state==='fight';
  if(r.routing){
   const ez=r.side==='p'?FIELD+40:-FIELD-40;moveTo(r,r.x*1.02,ez,dt,1.1);r.state='rout';
   if(Math.abs(r.z)>FIELD+30)r.fled=true;continue;
  }
  if(r.order&&r.order.type==='attack'){const tg=r.order.tg;if(!alive(tg)||(tg.routing&&!r.cav&&rdist(r,tg)>20))r.order=null}
  const foes=B.regs.filter(e=>e.side!==r.side&&alive(e));
  let contact=null,cd=1e9;
  for(const e of foes){const d=rdist(r,e);if(d<CONTACT&&d<cd){cd=d;contact=e}}
  let tg=r.order&&r.order.type==='attack'?r.order.tg:null;
  if(r.ranged){
   if(r.order&&r.order.type==='move'){if(moveTo(r,r.order.x,r.order.z,dt)){r.order=null;r.state='idle'}else r.state='move'}
   else if(contact){r.state='fight';turnTo(r,contact.x,contact.z,dt);meleeHit(r,contact,dt)}
   else{
    if(!tg){let n=null,nd=1e9;for(const e of foes){if(e.routing)continue;const d=rdist(r,e);if(d<nd){nd=d;n=e}}if(n&&nd<=RANGE)tg=n}
    if(tg){const d=rdist(r,tg);if(d>RANGE){moveTo(r,tg.x,tg.z,dt);r.state='move'}else{r.state='aim';turnTo(r,tg.x,tg.z,dt);r.cool-=dt;if(r.cool<=0)fire(r,tg)}}
    else r.state='idle';
   }
  } else {
   if(r.order&&r.order.type==='move'){
    if(contact&&cd<CONTACT*0.85){tg=contact;r.order=null}
    else if(moveTo(r,r.order.x,r.order.z,dt)){r.order=null;r.state='idle';r.chargeT=0}
    else{r.state='move';r.chargeT+=dt}
   }
   if(!(r.order&&r.order.type==='move')){
    if(!tg)tg=contact;
    if(tg){
     const d=rdist(r,tg);
     if(d>CONTACT){moveTo(r,tg.x,tg.z,dt,tg.routing&&r.cav?1.15:1);r.state='move';r.chargeT+=dt}
     else{
      if(!prevFight&&r.cav&&r.chargeT>1.2)meleeHit(r,tg,0,true);
      r.state='fight';r.chargeT=0;turnTo(r,tg.x,tg.z,dt);meleeHit(r,tg,dt);
     }
    } else {r.state='idle';r.chargeT=0}
   }
  }
  if(r.state!=='fight')r.morale=Math.min(100,r.morale+3*dt);
  if(B.cur[r.side]<B.init[r.side]*0.4)r.morale-=2*dt;
 }
 for(const r of B.regs){
  if(!alive(r))continue;
  if(r.men<=0.5){r.dead=true;r.men=0;continue}
  if(!r.routing&&(r.morale<=0||r.men<r.start*0.12)){r.routing=true;r.order=null;B.sel.delete(r);
   msg((r.side==='p'?'💀 Бегут твои ':'🏳 Бегут враги: ')+uname(r.t,r.side==='p'?'rome':B.ef).toLowerCase())}
 }
 // separation
 const al=B.regs.filter(r=>alive(r));
 for(let i=0;i<al.length;i++)for(let j=i+1;j<al.length;j++){
  const a=al[i],b=al[j];const same=a.side===b.side;const minD=same?(a.body==='inf'&&b.body==='inf'?10:12):4.5;
  const dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz);
  if(d<minD&&d>0.01){const p=(minD-d)*Math.min(1,dt*4)*0.5;const ux=dx/d,uz=dz/d;
   const wa=a.state==='fight'&&same?0.3:1,wb=b.state==='fight'&&same?0.3:1;
   a.x-=ux*p*wa;a.z-=uz*p*wa;b.x+=ux*p*wb;b.z+=uz*p*wb}
 }
 for(const r of al){r.x=Math.max(-100,Math.min(100,r.x));if(!r.routing)r.z=Math.max(-FIELD-25,Math.min(FIELD+25,r.z))}
 B.aiT-=dt;if(B.aiT<=0){B.aiT=0.6;aiThink()}
 const act=s=>B.regs.some(r=>r.side===s&&alive(r)&&!r.routing);
 if(!act('e'))finishBattle('p');else if(!act('p'))finishBattle('e');
 else if(B.time>480)finishBattle(B.playerSide==='def'?'p':'e');
}
function aiThink(){
 const mine=B.regs.filter(r=>r.side==='e'&&alive(r)&&!r.routing),foes=B.regs.filter(r=>r.side==='p'&&alive(r)&&!r.routing);
 if(!foes.length)return;
 const near=foes.some(f=>mine.some(m=>rdist(f,m)<60));
 const hold=B.playerSide==='att'&&B.time<30&&!near;
 for(const r of mine){
  if(r.state==='fight'&&!r.ranged)continue;
  if(r.ranged){
   const thr=foes.find(f=>!f.ranged&&rdist(f,r)<16&&f.state!=='fight');
   if(thr&&r.state!=='fight'){const dx=r.x-thr.x,dz=r.z-thr.z,l=Math.hypot(dx,dz)||1;r.order={type:'move',x:Math.max(-95,Math.min(95,r.x+dx/l*14)),z:Math.max(-FIELD-20,Math.min(FIELD+20,r.z+dz/l*14))};continue}
   if(r.order&&r.order.type==='move'&&!(Math.hypot(r.order.x-r.x,r.order.z-r.z)<1))continue;
   if(hold){r.order=null;continue}
   let n=null,nd=1e9;for(const f of foes){const d=rdist(r,f);if(d<nd){nd=d;n=f}}
   r.order=n?{type:'attack',tg:n}:null;continue;
  }
  if(hold)continue;
  const cur=r.order&&r.order.type==='attack'&&alive(r.order.tg)&&!r.order.tg.routing?r.order.tg:null;
  let best=null,bs=-1e9;

  const meshes=S3.meshes[r.t];
  for(let i=0;i<n;i++){
   const f=r.figs[i];
   const row=Math.floor(i/F.cols),inRow=row<rows-1?F.cols:n-row*F.cols,col=i%F.cols;
   let lx=(col-(inRow-1)/2)*F.sx,lz=((rows-1)/2-row)*F.sz*(fighting?0.75:1);
   if(r.routing){lx*=2.3;lz*=2;lx+=Math.sin(f.ph*7)*3;lz+=Math.cos(f.ph*5)*3}
   if(fighting){lx+=Math.sin(t*1.3+f.ph)*0.35;lz+=Math.sin(t*1.1+f.ph*2)*0.3+(row===0?0.8:0)}
   const sx=r.x+lx*ca+lz*sa,sz=r.z-lx*sa+lz*ca;
   const k=Math.min(1,dt*(r.routing?2.5:3.5));
   f.x+=(sx-f.x)*k;f.z+=(sz-f.z)*k;
   let y=Hgt(f.x,f.z),fa=r.face+f.j;
   if(moving)y+=Math.abs(Math.sin(t*(r.cav?11:9)+f.ph))*(r.cav?0.25:0.12);
   let lunge=0;
   if(fighting&&row<2){lunge=Math.max(0,Math.sin(t*7+f.ph*3))*0.45;fa+=Math.sin(t*5+f.ph)*0.25}
   dm.position.set(f.x+Math.sin(fa)*lunge,y,f.z+Math.cos(fa)*lunge);
   dm.rotation.set(0,fa,0);dm.scale.set(1,1,1);dm.updateMatrix();
   const idx=counters[r.t]++;
   for(const m of meshes){m.setMatrixAt(idx,dm.matrix);
    const ck=m.userData.ck;if(ck==='side'||ck==='shield'){S3.col.setHex(ck==='side'?SIDECOL[r.side]:SHCOL[r.side]);if(r.routing)S3.col.multiplyScalar(0.7);m.setColorAt(idx,S3.col)}}
  }
 }
 for(const k in S3.meshes)for(const m of S3.meshes[k]){m.count=counters[k];m.instanceMatrix.needsUpdate=true;if(m.instanceColor)m.instanceColor.needsUpdate=true}
}
function drawBanner(r,bn){
 const sel=B.sel.has(r);const key=[Math.round(r.men),Math.round(r.morale/5),r.routing,sel,r.dead||r.fled].join('|');
 if(key===r.bannerKey)return;r.bannerKey=key;
 const c=bn.c,x=c.getContext('2d');x.clearRect(0,0,128,72);
 const col=r.side==='p'?'#b3261e':'#2649a8';
 x.fillStyle='rgba(20,14,10,.78)';x.strokeStyle=sel?'#ffd84a':col;x.lineWidth=sel?6:4;
 rr(x,4,4,120,52,10);x.fill();x.stroke();
 x.font='30px serif';x.textAlign='center';x.textBaseline='middle';x.fillText(r.routing?'🏳️':UT[r.t].i,30,30);
 x.fillStyle='#000';x.fillRect(56,16,60,9);x.fillRect(56,33,60,7);
 x.fillStyle=r.men>50?'#7bc96f':r.men>25?'#e0b34a':'#e05a4a';x.fillRect(56,16,60*Math.max(0,r.men)/100,9);
 x.fillStyle='#e8c35a';x.fillRect(56,33,60*Math.max(0,r.morale)/100,7);
 x.fillStyle=col;x.beginPath();x.moveTo(56,56);x.lineTo(72,56);x.lineTo(64,70);x.fill();
 bn.tex.needsUpdate=true;
}
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function syncOverlays(dt){
 for(const [r,bn] of S3.banners){
  const vis=alive(r)&&r.figs.length>0;bn.sp.visible=vis;
  const ring=S3.rings.get(r);ring.visible=vis&&B.sel.has(r);
  if(!vis)continue;
  const ox=r.figs.reduce((a,f)=>a+f.x,0)/r.figs.length,oz=r.figs.reduce((a,f)=>a+f.z,0)/r.figs.length;
  bn.sp.position.set(ox,Hgt(ox,oz)+(r.body==='eleph'?8:r.body==='cav'?6.5:5),oz);
  const sc=Math.max(0.75,Math.min(1.6,S3.cam.dist/95));bn.sp.scale.set(7*sc,3.94*sc,1);
  drawBanner(r,bn);
  if(ring.visible){ring.position.set(r.x,Hgt(r.x,r.z)+0.4,r.z);ring.material.opacity=0.6+0.3*Math.sin(S3.t*5)}
 }
 S3.markers=S3.markers.filter(k=>{k.life-=dt;k.m.material.opacity=Math.max(0,k.life);k.m.scale.setScalar(1+(1.2-k.life)*0.8);if(k.life<=0){S3.scene.remove(k.m);k.m.geometry.dispose();k.m.material.dispose();return false}return true});
 // arrows
 const dm=S3.dm;let n=0;
 S3.arrows=S3.arrows.filter(a=>a.t<a.dur);
 for(const a of S3.arrows){
  a.t+=dt*(B.paused?0:B.speed);if(a.t<0)continue;
  const p=Math.min(1,a.t/a.dur),p2=Math.min(1,p+0.02);
  const ey=Hgt(a.ex,a.ez)+0.5;
  const P=(q)=>[a.sx+(a.ex-a.sx)*q,a.sy+(ey-a.sy)*q+Math.sin(Math.PI*q)*a.hgt,a.sz+(a.ez-a.sz)*q];
  const c=P(p),d=P(p2);dm.position.set(c[0],c[1],c[2]);dm.scale.set(1,1,1);dm.lookAt(d[0],d[1],d[2]);dm.updateMatrix();
  S3.arrowM.setMatrixAt(n++,dm.matrix);
 }
 S3.arrowM.count=n;S3.arrowM.instanceMatrix.needsUpdate=true;
}
function loop(now){
 if(!B||!S3)return;
 const rdt=Math.min(0.05,(now-B.last)/1000);B.last=now;S3.t+=rdt;
 if(!B.paused&&!B.over){const st=rdt*B.speed;const steps=Math.ceil(st/0.034);for(let i=0;i<steps&&!B.over;i++)simStep(st/steps)}
 B.msgs.forEach(m=>m.life-=rdt);B.msgs=B.msgs.filter(m=>m.life>0);
 updateCamera();syncFigures(rdt);syncOverlays(rdt);
 S3.R.render(S3.scene,S3.camera);
 B.hudT=(B.hudT||0)-rdt;if(B.hudT<=0){B.hudT=0.25;updateHud()}
 if(B&&S3)B.raf=requestAnimationFrame(loop);
}
// ---------- HUD ----------
function buildCards(){
 $('bCards').innerHTML=B.regs.filter(r=>r.side==='p').map(r=>`<div class="card" id="card${r.id}" onclick="cardTap(${r.id})"><div class="ci">${UT[r.t].i}</div><div class="cb"><i class="m"></i></div><div class="cb"><i class="mo"></i></div></div>`).join('');
}
function cardTap(id){
 const r=B.regs.find(x=>x.id===id);if(!r||!alive(r)||r.routing)return;
 if(B.sel.has(r)&&B.sel.size===1){S3.cam.tx=r.x;S3.cam.tz=r.z+18*Math.cos(S3.cam.yaw);return}
 if(B.sel.has(r))B.sel.delete(r);else B.sel.add(r);updateHud();
}
function updateHud(){
 if(!B)return;
 const sh=sd=>B.regs.filter(r=>r.side===sd&&alive(r)&&!r.routing).reduce((a,r)=>a+Math.max(0,r.men),0)/Math.max(1,B.init[sd])*100;
 $('barP').style.width=sh('p')+'%';$('barE').style.width=sh('e')+'%';
 const s=Math.floor(B.time);$('bTime').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
 $('bPause').textContent=B.paused?'▶':'⏸';$('bPause').classList.toggle('pri',B.paused);
 $('bSpeed').textContent='×'+B.speed;
 $('bMsg').innerHTML=B.msgs.map(m=>`<div style="opacity:${Math.min(1,m.life)}">${m.t}</div>`).join('');
 B.regs.filter(r=>r.side==='p').forEach(r=>{const c=$('card'+r.id);if(!c)return;
  c.classList.toggle('sel',B.sel.has(r));c.classList.toggle('gone',!alive(r)||r.routing);
  c.querySelector('.m').style.width=Math.max(0,r.men)+'%';c.querySelector('.mo').style.width=Math.max(0,r.morale)+'%';
  c.querySelector('.ci').textContent=r.routing?'🏳️':!alive(r)?'☠':UT[r.t].i;});
 const sel=[...B.sel];
 $('bInfo').innerHTML=sel.length===1?`<b>${uname(sel[0].t,'rome')}</b> · ${Math.round(sel[0].men)} бойцов · боевой дух ${Math.round(Math.max(0,sel[0].morale))}%`:sel.length?`Выбрано полков: ${sel.length}`:'<span class="small">Тапни свой полк, затем — врага (атака) или землю (марш).</span>';
}
function bPause(){if(!B||B.over)return;B.paused=!B.paused;updateHud()}
function bSpeed(){if(!B)return;B.speed=B.speed===1?2:B.speed===2?3:1;updateHud()}
function bSelAll(){if(!B)return;const a=B.regs.filter(r=>r.side==='p'&&alive(r)&&!r.routing);B.sel=new Set(B.sel.size===a.length?[]:a);updateHud()}
function bCharge(){
 if(!B||B.over)return;const sel=B.sel.size?[...B.sel]:B.regs.filter(r=>r.side==='p'&&alive(r)&&!r.routing);
 const foes=B.regs.filter(r=>r.side==='e'&&alive(r)&&!r.routing);if(!foes.length)return;
 sel.forEach(r=>{let n=null,nd=1e9;foes.forEach(f=>{const d=rdist(r,f);if(d<nd){nd=d;n=f}});r.order={type:'attack',tg:n}});
 if(B.paused){B.paused=false}msg('⚔ В атаку!');updateHud();
}
function bHalt(){if(!B)return;[...B.sel].forEach(r=>{r.order=r.ranged?null:{type:'move',x:r.x,z:r.z}});msg('Стоять!')}

// ===================== UI HELPERS =====================
function modal(html){$('modalRoot').innerHTML=`<div class="overlay"><div class="modal">${html}</div></div>`}
function closeModal(){$('modalRoot').innerHTML=''}
function ask(title,body,btns){
 return new Promise(res=>{
  window.__ans=v=>{closeModal();res(v)};
  modal(`<h2>${title}</h2>${body}<div class="row" style="margin-top:14px">${btns.map(b=>`<button class="${b[2]?'pri':''}" onclick="__ans('${b[0]}')">${b[1]}</button>`).join('')}</div>`);
 });
}
function toast(t){addLog(t);render()}
function showHelp(){modal(`<h2>Как играть</h2>
<p><b>Цель:</b> захвати ${WIN_N} из 18 провинций или уничтожь Карфаген, галлов и греков. Если падёт Рим — конец.</p>
<p><b>Карта:</b> нажми свою провинцию с армией (⚔), выбери отряды и нажми на подсвеченную соседнюю провинцию. Пунктир голубым — морской путь.</p>
<p><b>Экономика:</b> провинции приносят золото, каждый отряд стоит 20 в ход. Улучшай города: больше дохода, наймов и ополчения.</p>
<p><b>3D-битва:</b> идёт в реальном времени. Тапни свой полк (или карточку внизу), затем тапни врага — атака, или землю — марш. Палец двигает камеру, двумя пальцами — масштаб и поворот. ⏸ — пауза, во время паузы можно отдавать приказы.</p>
<p>Полки бегут, когда падает боевой дух (жёлтая полоса). Удар во фланг ×1.35, в тыл ×1.8 — обходи врага конницей!</p>
<p>🛡️ Копейщики ×2 против конницы и слонов · 🐎 Конница: натиск после разбега (2+ клетки), опасна для лучников · 🏹 Лучники бьют издалека, слабы вблизи · 🌲 Лес: защита и укрытие от стрел, но конница там вязнет.</p>
<button class="pri" onclick="closeModal()">Понятно</button>`)}
</script>
