<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Imperium: Европа 1100</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Ruslan+Display&family=PT+Serif:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#17120e;--panel:#241b14;--line:#6b4f2c;--gold:#d9a93a;--text:#f0e6d0;--muted:#a8977a;--red:#a8231b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'PT Serif',Georgia,serif;overflow:hidden}
button{font-family:inherit;font-size:15px;border:1px solid var(--line);background:#3a2e21;color:var(--text);padding:9px 12px;border-radius:8px;cursor:pointer}
button:active{transform:scale(.97)}
button.pri{background:linear-gradient(#a8231b,#6e1510);border-color:#d9a93a;font-weight:700}
button:disabled{opacity:.4}
.h{font-family:'Ruslan Display',serif;letter-spacing:.5px}
#app{display:flex;flex-direction:column;height:100%}
#top{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#140f0b;border-bottom:1px solid var(--line)}
#top .stat{font-size:13px;white-space:nowrap}
#top{gap:6px!important}
#top .grow{flex:1}
#mapWrap{flex:1;min-height:0;position:relative;background:#244a63;overflow:hidden}
#mapBtns{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
#mapBtns button{width:38px;height:38px;padding:0;font-size:18px;background:#241b14dd}
#map.far .reg:not(.big) .lbl{display:none}
#map.far .reg .lbl{font-size:24px;stroke-width:4px}
#map.mid .reg:not(.big) .lbl{display:none}
#map{width:100%;height:100%;display:block}
#panel{max-height:46%;overflow-y:auto;background:var(--panel);border-top:2px solid var(--line);padding:10px 12px 14px}
#log{font-size:13px;color:var(--muted);min-height:18px;margin-bottom:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;padding:5px 8px;border-radius:7px;background:#3a2e21;border:1px solid var(--line);font-size:13px;margin:3px 3px 0 0}
.chip.sel{border-color:var(--gold);background:#4d3b22;box-shadow:0 0 0 1px var(--gold) inset}
.hpb{display:inline-block;width:28px;height:5px;background:#000;border-radius:3px;overflow:hidden;vertical-align:middle}
.hpb i{display:block;height:100%;background:#7bc96f}
.overlay{position:fixed;inset:0;background:rgba(10,7,5,.82);display:flex;align-items:center;justify-content:center;z-index:70;padding:16px}
.modal{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:18px;max-width:420px;width:100%;max-height:90%;overflow-y:auto;box-shadow:0 10px 40px #000}
.modal h2{margin:0 0 10px;font-family:'Ruslan Display',serif;color:var(--gold);font-size:20px}
.modal p{margin:6px 0;line-height:1.4}
.rec{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #3d3124}
.tabs{display:flex;gap:6px;margin:8px 0 2px}.tabs button{flex:1;padding:7px 6px;font-size:13px}.tabs button.on{border-color:var(--gold);background:#4d3b22;color:#fff}
.small{font-size:12px;color:var(--muted)}
/* battle 3d */
#battle{position:fixed;inset:0;background:#000;z-index:40;display:none}
#b3d{position:absolute;inset:0}
#b3d canvas{display:block;width:100%;height:100%}
.bh{position:absolute;left:0;right:0;pointer-events:none;padding:8px 10px}
.bh button,.bh .card{pointer-events:auto}
#bHead{top:0;background:linear-gradient(rgba(10,7,5,.85),rgba(10,7,5,0))}
#bFoot{bottom:0;background:linear-gradient(rgba(10,7,5,0),rgba(10,7,5,.9) 30%);padding-top:22px}
.bars{display:flex;gap:8px;align-items:center;font-size:12px;margin-top:5px}
.bar{flex:1;height:8px;background:#000a;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;transition:width .3s}
#bMsg{position:absolute;top:74px;left:0;right:0;text-align:center;font-size:14px;font-weight:700;text-shadow:0 1px 3px #000,0 0 6px #000;pointer-events:none;line-height:1.5}
#bCards{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.card{flex:0 0 auto;width:52px;background:#2a221acc;border:2px solid #5a4630;border-radius:8px;padding:4px;text-align:center;cursor:pointer}
.card.sel{border-color:var(--gold);background:#4d3b22dd;box-shadow:0 0 8px #e0b34a88}
.card.gone{opacity:.35}
.card .ci{font-size:22px;line-height:1.2}
.cb{height:4px;background:#000;border-radius:2px;overflow:hidden;margin-top:3px}
.cb i{display:block;height:100%}
.cb .m{background:#7bc96f}.cb .mo{background:#e8c35a}.cb .st{background:#6fb7ff}
#bInfo{font-size:13px;margin:2px 0 6px;min-height:18px;text-shadow:0 1px 2px #000}
.bbtn{padding:8px 10px;font-size:14px}
#title{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 30%,#5a1f14,#140c08 70%);text-align:center;padding:20px}
#title h1{font-family:'Ruslan Display',serif;font-weight:400;font-size:46px;margin:0;color:var(--gold);text-shadow:0 3px 0 #5a2a10,0 0 30px #a0602080}
#title .sub{color:var(--muted);font-size:15px;max-width:320px}
#title button{min-width:220px;font-size:17px;padding:12px}
</style>
</head>
<body>
<div id="title">
  <div style="font-size:54px;filter:drop-shadow(0 4px 8px #000)">🛡️</div>
  <h1>IMPERIUM</h1>
  <div class="sub">Европа, 1100 год. Шесть великих держав и десятки княжеств, королевств и эмиратов. Выбери свою — и построй империю.</div>
  <button class="pri" onclick="showNewGame()">Новая игра</button>
  <button id="contBtn" onclick="loadGame()" style="display:none">Продолжить</button>
  <button onclick="showSaves()">Загрузить</button>
  <button onclick="showHelp()">Как играть</button>
</div>

<div id="app">
  <div id="top">
    <span class="h" id="sFac" style="color:var(--gold);font-size:18px">⚑</span>
    <span class="stat" id="sGold"></span>
    <span class="stat" id="sTurn"></span>
    <span class="grow"></span>
    <button onclick="showRealm()" style="padding:7px 10px" aria-label="Держава">☰</button>
    <button class="pri" id="endBtn" onclick="endTurn()">Ход ▶</button>
  </div>
  <div id="mapWrap"><svg id="map" viewBox="0 0 640 800"></svg>
    <div id="mapBtns"><button onclick="mapZoom(0.75)">＋</button><button onclick="mapZoom(1.33)">−</button><button onclick="mapHome()">◎</button></div></div>
  <div id="panel"><div id="log"></div><div id="pInfo"></div></div>
</div>

<div id="battle">
  <div id="b3d"></div>
  <div class="bh" id="bHead">
    <div class="row" style="justify-content:space-between;flex-wrap:nowrap">
      <span class="h" id="bTitle" style="color:var(--gold);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></span>
      <div class="row" style="flex-wrap:nowrap;gap:6px"><span id="bTime" class="small"></span><button class="bbtn" id="bSpeed" onclick="bSpeed()">×1</button><button class="bbtn pri" id="bPause" onclick="bPause()">▶</button></div>
    </div>
    <div class="bars"><span>🟥</span><div class="bar"><i id="barP" style="background:#d9534f"></i></div><div class="bar"><i id="barE" style="background:#5b7bd9"></i></div><span>🟦</span></div>
  </div>
  <div id="bMsg"></div>
  <div class="bh" id="bFoot">
    <div id="bInfo"></div>
    <div id="bCards"></div>
    <div class="row" style="gap:6px">
      <button class="bbtn" onclick="bSelAll()">Все</button>
      <button class="bbtn pri" onclick="bCharge()">⚔ В атаку!</button>
      <button class="bbtn" onclick="bHalt()">✋ Стоп</button>
      <button class="bbtn" id="bForm" onclick="bForm()" disabled>Строй</button>
      <button class="bbtn" onclick="bAuto()">🎲</button>
      <button class="bbtn" onclick="bRetreat()">🏳</button>
    </div>
  </div>
</div>

<div id="modalRoot"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
